hostname rt1
!
interface eth-rt2
 ip address 10.0.1.1/24
!
interface eth-rt3
 ip address 10.0.2.1/24
!
key chain kc1
 key 1
  key-string isaacauthkey01
  cryptographic-algorithm md5
 exit
exit
!
bfd
 peer 10.0.1.2 local-address 10.0.1.1 interface eth-rt2
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
  authentication key-chain kc1
  authentication optimized
 exit
 peer 10.0.2.3 local-address 10.0.2.1 interface eth-rt3
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
  authentication key-chain kc1
  authentication optimized
 exit
exit
!
