hostname rt2
!
interface eth-rt1
 ip address 10.0.1.2/24
!
key chain kc1
 key 1
  key-string isaacauthkey01
  cryptographic-algorithm md5
 exit
exit
!
bfd
 peer 10.0.1.1 local-address 10.0.1.2 interface eth-rt1
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
  authentication key-chain kc1
  authentication optimized
 exit
exit
!
